[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "singing-digital-human-backend"
version = "0.1.0"
description = "Backend for the Singing Digital Human web app (FastAPI + Wav2Lip-ONNX + DirectML)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Singing Digital Human Team" }]
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "numpy>=1.26.0",
    "opencv-python-headless>=4.9.0",
    "librosa>=0.10.1",
    "soundfile>=0.12.1",
    "onnxruntime-directml>=1.17.0",
    "onnxruntime>=1.17.0",
    "pychorus>=0.0.7",
    "Pillow>=10.2.0",
    "aiofiles>=23.2.1",
    "python-json-logger>=2.0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
singing-dh-backend = "run:main"

[tool.setuptools]
packages = ["core", "api"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
